steps:
- title: Potatoes
  steps:
  - text: Scrub the potatoes.
  - text: Transfer to a large saucepan, and cover with water, bring to a boil.
  - text: Simmer for 20-25 minutes.
  - text: Drain and cool.
  - text: Break up into bite-sized pieces.
  - text: Heat 2 tbsp of oil on a large saucepan (ideally the one used to boil the
      potatoes). Add the caraway seeds, garam masala, mustard seeds, 2 cloves of chopped
      garlic, and half the chopped ginger.
  - text: Heat until the mustard seeds begin to pop.
  - text: Add the potatoes, and stir vigorously - just to combine.
- title: Korma
  steps:
  - text: Fry the onion in a large saucepan, until starting to soften.
  - text: Add half the chopped garlic and ginger, cook for 2-3 minutes.
  - text: Add the tomato puree, ground cumin, curry powder, ground coriander, cardamom,
      turmeric and cook for 1 minute.
  - text: Add the peppers, cook for 2 minutes.
  - text: Add the stock, simmer for 10 minutes.
  - text: Add the beans, broccoli, and cream, simmer for 5 minutes, until it starts
      to thicken.
- title: Combine
  steps:
  - text: Pre-heat the oven to 180C.
  - text: Combine the korma and the potatoes in a large baking dish.
  - text: Bake for 15-20 minutes.
  - text: Serve with fresh, copped coriander, lemon wedges and chutney.
